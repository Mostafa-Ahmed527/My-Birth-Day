<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>صور عيد الميلاد</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
            animation: fadeIn 0.5s ease-in-out;
        }
        
        .header h1 {
            font-size: 2em;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
            margin-bottom: 15px;
        }
        
        .back-button {
            display: inline-block;
            padding: 12px 20px;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: 2px solid white;
            border-radius: 25px;
            text-decoration: none;
            font-weight: bold;
            transition: all 0.3s;
            cursor: pointer;
            font-size: 1em;
        }
        
        .back-button:hover {
            background: white;
            color: #764ba2;
            transform: translateY(-2px);
        }
        
        .gallery-container {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 15px;
            animation: fadeIn 0.7s ease-in-out;
        }
        
        .gallery-item {
            position: relative;
            overflow: hidden;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            cursor: pointer;
            transition: transform 0.3s;
        }
        
        .gallery-item:hover {
            transform: scale(1.05);
        }
        
        .gallery-item img {
            width: 100%;
            height: 300px;
            object-fit: cover;
            display: block;
            transition: transform 0.5s;
        }
        
        .gallery-item:hover img {
            transform: scale(1.1);
        }
        
        .gallery-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.3s;
        }
        
        .gallery-item:hover .gallery-overlay {
            opacity: 1;
        }
        
        .expand-icon {
            color: white;
            font-size: 2em;
        }
        
        /* Modal */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            padding: 0;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.9);
            animation: fadeIn 0.3s;
        }
        
        .modal.active {
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .modal-content {
            position: relative;
            max-width: 90vw;
            max-height: 90vh;
        }
        
        .modal-content img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        
        .close {
            position: absolute;
            right: 15px;
            top: 15px;
            color: white;
            font-size: 2em;
            font-weight: bold;
            cursor: pointer;
            background: rgba(0, 0, 0, 0.5);
            width: 45px;
            height: 45px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            transition: all 0.3s;
        }
        
        .close:hover {
            background: rgba(0, 0, 0, 0.8);
            transform: scale(1.1);
        }
        
        .nav-arrow {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            color: white;
            font-size: 1.8em;
            cursor: pointer;
            background: rgba(0, 0, 0, 0.5);
            width: 45px;
            height: 45px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            transition: all 0.3s;
        }
        
        .nav-arrow:hover {
            background: rgba(0, 0, 0, 0.8);
        }
        
        .prev {
            left: 15px;
        }
        
        .next {
            right: 15px;
        }
        
        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }
        
        @media (max-width: 768px) {
            .header {
                margin-bottom: 25px;
            }
            
            .header h1 {
                font-size: 1.6em;
                margin-bottom: 12px;
            }
            
            .back-button {
                padding: 10px 16px;
                font-size: 0.9em;
            }
            
            .gallery-container {
                grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
                gap: 10px;
            }
            
            .gallery-item img {
                height: 200px;
            }
            
            .close {
                right: 10px;
                top: 10px;
                width: 40px;
                height: 40px;
                font-size: 1.5em;
            }
            
            .nav-arrow {
                width: 40px;
                height: 40px;
                font-size: 1.5em;
            }
            
            .prev {
                left: 10px;
            }
            
            .next {
                right: 10px;
            }
        }
        
        @media (max-width: 480px) {
            body {
                padding: 10px;
            }
            
            .header {
                margin-bottom: 20px;
            }
            
            .header h1 {
                font-size: 1.4em;
            }
            
            .gallery-container {
                grid-template-columns: 1fr;
            }
            
            .gallery-item img {
                height: 220px;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🎂 صور حفلة عيد الميلاد 🎉</h1>
        <a href="index.html" class="back-button">← العودة للرئيسية</a>
    </div>
    
    <div class="gallery-container" id="gallery"></div>
    
    <div class="modal" id="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <span class="prev">&#10094;</span>
            <img id="modalImage" src="" alt="صورة مكبرة">
            <span class="next">&#10095;</span>
        </div>
    </div>
    
    <script>
        const images = [
            './WhatsApp Image 2026-08-13 at 12.51.37 AM.jpeg',
            './WhatsApp Image 2026-08-13 at 12.51.38 AM.jpeg',
            './WhatsApp Image 2026-08-13 at 12.51.39 AM(1).jpeg',
            './WhatsApp Image 2026-08-13 at 12.51.39 AM(2).jpeg',
            './WhatsApp Image 2026-08-13 at 12.51.39 AM(3).jpeg',
            './WhatsApp Image 2026-08-13 at 12.51.39 AM.jpeg',
            './WhatsApp Image 2026-08-13 at 12.51.40 AM.jpeg',
            './WhatsApp Image 2026-08-13 at 12.51.41 AM.jpeg',
            './WhatsApp Image 2026-08-13 at 12.51.42 AM.jpeg'
        ];
        
        let currentImageIndex = 0;
        const gallery = document.getElementById('gallery');
        const modal = document.getElementById('modal');
        const modalImage = document.getElementById('modalImage');
        const closeBtn = document.querySelector('.close');
        const prevBtn = document.querySelector('.prev');
        const nextBtn = document.querySelector('.next');
        
        // Create gallery items
        images.forEach((image, index) => {
            const item = document.createElement('div');
            item.className = 'gallery-item';
            item.innerHTML = `
                <img src="${image}" alt="صورة عيد الميلاد">
                <div class="gallery-overlay">
                    <span class="expand-icon">🔍</span>
                </div>
            `;
            item.addEventListener('click', () => openModal(index));
            gallery.appendChild(item);
        });
        
        function openModal(index) {
            currentImageIndex = index;
            modalImage.src = images[index];
            modal.classList.add('active');
        }
        
        function closeModal() {
            modal.classList.remove('active');
        }
        
        function nextImage() {
            currentImageIndex = (currentImageIndex + 1) % images.length;
            modalImage.src = images[currentImageIndex];
        }
        
        function prevImage() {
            currentImageIndex = (currentImageIndex - 1 + images.length) % images.length;
            modalImage.src = images[currentImageIndex];
        }
        
        closeBtn.addEventListener('click', closeModal);
        prevBtn.addEventListener('click', prevImage);
        nextBtn.addEventListener('click', nextImage);
        
        // Close modal when clicking outside the image
        modal.addEventListener('click', (e) => {
            if (e.target === modal) {
                closeModal();
            }
        });
        
        // Keyboard navigation
        document.addEventListener('keydown', (e) => {
            if (modal.classList.contains('active')) {
                if (e.key === 'ArrowRight') nextImage();
                if (e.key === 'ArrowLeft') prevImage();
                if (e.key === 'Escape') closeModal();
            }
        });
    </script>
</body>
</html>

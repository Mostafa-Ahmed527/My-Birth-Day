<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Birth Day</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 15px;
        }
        
        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 25px;
            text-align: center;
            max-width: 500px;
            width: 100%;
        }
        
        .cake-image {
            width: 100%;
            max-width: 100%;
            height: 250px;
            margin-bottom: 20px;
            border-radius: 15px;
            object-fit: cover;
        }
        
        h1 {
            color: #764ba2;
            font-size: 2em;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
        }
        
        .input-group {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
            flex-direction: row;
        }
        
        input {
            flex: 1;
            padding: 14px 12px;
            border: 2px solid #667eea;
            border-radius: 10px;
            font-size: 16px;
            outline: none;
            transition: border-color 0.3s;
            font-family: inherit;
        }
        
        input:focus {
            border-color: #764ba2;
        }
        
        button {
            padding: 14px 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            white-space: nowrap;
            font-family: inherit;
        }
        
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
        }
        
        button:active {
            transform: translateY(0);
        }
        
        .wishes-list {
            margin-top: 20px;
            max-height: 300px;
            overflow-y: auto;
            text-align: right;
        }
        
        .wish-item {
            background: #f0f0f0;
            padding: 12px;
            margin-bottom: 10px;
            border-radius: 10px;
            color: #333;
            border-right: 4px solid #667eea;
            animation: slideIn 0.3s ease-in-out;
            font-size: 0.95em;
            word-wrap: break-word;
        }
        
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .wishes-title {
            color: #764ba2;
            margin-top: 20px;
            margin-bottom: 15px;
            font-size: 1.1em;
        }
        
        @media (max-width: 600px) {
            body {
                padding: 10px;
            }
            
            .container {
                padding: 20px;
                border-radius: 15px;
            }
            
            h1 {
                font-size: 1.8em;
                margin-bottom: 15px;
            }
            
            .input-group {
                gap: 6px;
                margin-bottom: 15px;
            }
            
            input, button {
                padding: 12px 10px;
                font-size: 15px;
            }
            
            button {
                padding: 12px 15px;
            }
            
            .wishes-list {
                max-height: 400px;
                margin-top: 15px;
            }
            
            .wish-item {
                padding: 10px;
                margin-bottom: 8px;
                font-size: 0.9em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="https://images.unsplash.com/photo-1578985545062-69928b1d9587?w=400" alt="Birthday Cake" class="cake-image">
        
        <h1>🎂 My Birth Day 🎉</h1>
        
        <div class="input-group">
            <input 
                type="text" 
                id="wishInput" 
                placeholder="اكتب كلمة حلوة..."
                onkeypress="handleKeyPress(event)"
            >
            <button onclick="addWish()">ادخل</button>
        </div>
        
        <div class="wishes-list" id="wishesList"></div>
        <div class="wishes-title" id="wishesTitle" style="display: none;">التهاني والكلمات الحلوة:</div>
    </div>
    
    <script>
        const wishes = JSON.parse(localStorage.getItem('wishes')) || [];
        
        function displayWishes() {
            const wishesList = document.getElementById('wishesList');
            const wishesTitle = document.getElementById('wishesTitle');
            wishesList.innerHTML = '';
            
            if (wishes.length > 0) {
                wishesTitle.style.display = 'block';
                wishes.forEach((wish, index) => {
                    const wishItem = document.createElement('div');
                    wishItem.className = 'wish-item';
                    wishItem.textContent = wish;
                    wishesList.appendChild(wishItem);
                });
            } else {
                wishesTitle.style.display = 'none';
            }
        }
        
        function addWish() {
            const input = document.getElementById('wishInput');
            const wish = input.value.trim();
            
            if (wish !== '') {
                wishes.unshift(wish);
                localStorage.setItem('wishes', JSON.stringify(wishes));
                input.value = '';
                displayWishes();
                // الانتقال إلى صفحة الصور
                setTimeout(() => {
                    window.location.href = 'gallery.html';
                }, 500);
            }
        }
        
        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                addWish();
            }
        }
        
        // Display wishes on page load
        displayWishes();
        document.getElementById('wishInput').focus();
    </script>
</body>
</html>
